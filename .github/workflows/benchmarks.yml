name: Microbenchmarks

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install AMBER jmh-core
        run: |
          mvn install:install-file -Dfile=libs/jmh-core-1.37-all.jar \
            -DgroupId=org.openjdk.jmh -DartifactId=jmh-core \
            -Dversion=1.37-extended -Dpackaging=jar

      - name: Build Benchmarks JAR
        run: ./mvnw -B package -DskipTests

      - name: Run Microbenchmarks
        run: |
          mkdir -p target/jmh-results
          java -jar target/benchmarks.jar -wi 3 -i 3 -f 1 -rf json -rff target/jmh-results/results-ci.json

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/jmh-results/results-ci.json